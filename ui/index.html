<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NVColor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-text">
        <h1>NVColor</h1>
        <p class="subtitle" data-i18n="subtitle">Color presets for desktop &amp; games</p>
      </div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" class="lang-btn active" data-lang="en" id="lang-en" title="English">EN</button>
        <button type="button" class="lang-btn" data-lang="ru" id="lang-ru" title="Русский">RU</button>
      </div>
    </header>

    <div class="shell">
      <aside class="nav">
        <div class="nav-label" data-i18n="presetsNav">Presets</div>
        <div id="preset-list" class="preset-list" role="listbox"></div>
        <div class="nav-actions">
          <button type="button" class="btn" id="btn-new" data-i18n="new">New</button>
          <button type="button" class="btn" id="btn-delete" data-i18n="delete">Delete</button>
          <button type="button" class="btn btn-accent" id="btn-apply" data-i18n="apply">Apply</button>
        </div>
      </aside>

      <main class="content">
        <section class="card">
          <h2 data-i18n="preset">Preset</h2>
          <div class="row">
            <label for="name" data-i18n="name">Name</label>
            <input id="name" type="text" autocomplete="off" />
          </div>
          <div class="row">
            <label for="hotkey" data-i18n="hotkey">Hotkey</label>
            <div class="hotkey-row">
              <input id="hotkey" type="text" autocomplete="off" data-i18n-placeholder="hotkeyPlaceholder" placeholder="ctrl+alt+1" />
              <button type="button" class="btn" id="btn-capture" data-i18n="capture">Capture</button>
            </div>
          </div>
        </section>

        <section class="card">
          <h2 data-i18n="color">Color</h2>
          <div class="slider-row">
            <label for="brightness" data-i18n="brightness">Brightness</label>
            <input id="brightness" type="range" min="0" max="1" step="0.01" value="0.5" />
            <span id="brightness-val" class="mono">0.50</span>
          </div>
          <div class="slider-row">
            <label for="contrast" data-i18n="contrast">Contrast</label>
            <input id="contrast" type="range" min="0" max="1" step="0.01" value="0.5" />
            <span id="contrast-val" class="mono">0.50</span>
          </div>
          <div class="slider-row">
            <label for="gamma" data-i18n="gamma">Gamma</label>
            <input id="gamma" type="range" min="0.4" max="2.8" step="0.01" value="1" />
            <span id="gamma-val" class="mono">1.00</span>
          </div>
          <div class="slider-row">
            <label for="vibrance" data-i18n="vibrance">Digital Vibrance</label>
            <input id="vibrance" type="range" min="0" max="100" step="1" value="50" />
            <span id="vibrance-val" class="mono">50</span>
          </div>
          <div class="slider-row">
            <label for="hue" data-i18n="hue">Hue</label>
            <input id="hue" type="range" min="0" max="360" step="1" value="0" />
            <span id="hue-val" class="mono">0</span>
          </div>
          <div class="actions">
            <button type="button" class="btn btn-accent" id="btn-save" data-i18n="savePreset">Save preset</button>
            <button type="button" class="btn" id="btn-reset" data-i18n="hardReset">Hard reset</button>
          </div>
        </section>

        <section class="card">
          <h2 data-i18n="automation">Automation</h2>
          <label class="switch-row">
            <span data-i18n="watchProcess">Watch game process</span>
            <input id="watch-enabled" type="checkbox" role="switch" />
          </label>
          <label class="switch-row">
            <span data-i18n="allDisplays">Apply to all displays</span>
            <input id="all-displays" type="checkbox" role="switch" />
          </label>
          <div class="row tight">
            <label for="processes" data-i18n="processes">Processes</label>
            <input id="processes" type="text" data-i18n-placeholder="processesPlaceholder" placeholder="game.exe, other.exe" />
          </div>
          <div class="row">
            <label id="on-start-label" data-i18n="onStart">On start</label>
            <div
              class="combo"
              id="on-start"
              role="combobox"
              aria-labelledby="on-start-label"
              aria-expanded="false"
              aria-haspopup="listbox"
              tabindex="0"
            >
              <button type="button" class="combo-trigger" tabindex="-1">
                <span class="combo-value"></span>
              </button>
              <div class="combo-menu" role="listbox" hidden></div>
            </div>
          </div>
          <div class="row">
            <label id="on-exit-label" data-i18n="onExit">On exit</label>
            <div
              class="combo"
              id="on-exit"
              role="combobox"
              aria-labelledby="on-exit-label"
              aria-expanded="false"
              aria-haspopup="listbox"
              tabindex="0"
            >
              <button type="button" class="combo-trigger" tabindex="-1">
                <span class="combo-value"></span>
              </button>
              <div class="combo-menu" role="listbox" hidden></div>
            </div>
          </div>
          <p class="hint" data-i18n="processesHint">Comma-separated process names, e.g. process.exe</p>
        </section>

        <section class="card">
          <h2 data-i18n="config">Config</h2>
          <p class="hint" style="margin-top:0;margin-bottom:12px" data-i18n-html="configHint">
            Import / export full <span class="mono">config.json</span> (presets, hotkeys, automation).
          </p>
          <div class="actions" style="margin-top:0">
            <button type="button" class="btn" id="btn-import" data-i18n="import">Import…</button>
            <button type="button" class="btn btn-accent" id="btn-export" data-i18n="export">Export…</button>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
